<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">DexBuilder integration lifecycle</title><desc id="desc">A Builder integration moves through registration, funding, trading, PnL settlement, withdrawal, and revenue reconciliation.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#19D969"/></marker><style>.t{font-family:Inter,Arial,sans-serif;fill:#F3F7F4}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#9AA79E}.h{font-size:28px;font-weight:700}.k{font-size:13px;font-weight:700;letter-spacing:2px;fill:#19D969}.n{font-size:18px;font-weight:650}.s{font-size:13px}.i{font-size:14px;font-weight:800;fill:#07100B}</style></defs>
  <rect width="1200" height="520" rx="28" fill="#07100B"/>
  <text x="64" y="62" class="t k">END-TO-END BUILDER FLOW</text><text x="64" y="102" class="t h">From first signature to reconciled revenue</text><text x="64" y="132" class="m s">Every user action has a stable identifier, status, and matching ledger evidence.</text>
  <path d="M190 256H320M410 256H540M630 256H760M850 256H980" fill="none" stroke="#19D969" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(70 202)"><rect width="120" height="108" rx="18" fill="#0E1912" stroke="#2C3A31"/><circle cx="24" cy="24" r="14" fill="#19D969"/><text x="20" y="29" class="i">1</text><text x="20" y="68" class="t n">Register</text><text x="20" y="91" class="m s">wallet → account</text></g>
  <g transform="translate(320 202)"><rect width="120" height="108" rx="18" fill="#0E1912" stroke="#2C3A31"/><circle cx="24" cy="24" r="14" fill="#19D969"/><text x="20" y="29" class="i">2</text><text x="20" y="68" class="t n">Fund</text><text x="20" y="91" class="m s">chain → ledger</text></g>
  <g transform="translate(540 202)"><rect width="120" height="108" rx="18" fill="#0D1D13" stroke="#19D969" stroke-width="2"/><circle cx="24" cy="24" r="14" fill="#19D969"/><text x="20" y="29" class="i">3</text><text x="20" y="68" class="t n">Trade</text><text x="20" y="91" class="m s">order → fill</text></g>
  <g transform="translate(760 202)"><rect width="120" height="108" rx="18" fill="#0E1912" stroke="#2C3A31"/><circle cx="24" cy="24" r="14" fill="#19D969"/><text x="20" y="29" class="i">4</text><text x="20" y="68" class="t n">Settle</text><text x="20" y="91" class="m s">PnL → balance</text></g>
  <g transform="translate(980 202)"><rect width="150" height="108" rx="18" fill="#0E1912" stroke="#2C3A31"/><circle cx="24" cy="24" r="14" fill="#19D969"/><text x="20" y="29" class="i">5</text><text x="20" y="68" class="t n">Withdraw</text><text x="20" y="91" class="m s">ledger → wallet</text></g>
  <path d="M600 310V375H750" fill="none" stroke="#19D969" stroke-width="2" marker-end="url(#a)"/>
  <g transform="translate(750 350)"><rect width="380" height="100" rx="18" fill="#0C1510" stroke="#2C3A31"/><text x="24" y="38" class="t n">Builder revenue reconciliation</text><text x="24" y="66" class="m s">fill → user fee → protocol fee → Builder revenue → payout</text></g>
</svg>
