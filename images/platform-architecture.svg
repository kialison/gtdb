<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">DexBuilder platform architecture</title>
  <desc id="desc">User wallets connect to a Builder DEX, which uses DexBuilder execution, margin, ledger, and settlement infrastructure.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#19D969"/></marker>
    <style>.t{font-family:Inter,Arial,sans-serif;fill:#F3F7F4}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#96A59B}.h{font-size:28px;font-weight:700}.k{font-size:13px;font-weight:700;letter-spacing:2px;fill:#19D969}.n{font-size:20px;font-weight:650}.s{font-size:14px}.chip{font-size:13px;font-weight:600;fill:#C7D2CA}</style>
  </defs>
  <rect width="1200" height="560" rx="28" fill="#07100B"/>
  <path d="M262 266H360M574 266H650M910 266H995" fill="none" stroke="#19D969" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="64" y="62" class="t k">DexBuilder SYSTEM MAP</text>
  <text x="64" y="102" class="t h">One integration. Complete perpetual infrastructure.</text>
  <text x="64" y="132" class="m s">A Builder owns the product experience; DexBuilder supplies the shared execution and settlement layer.</text>

  <g transform="translate(64 202)">
    <rect width="198" height="128" rx="18" fill="#0E1912" stroke="#2B3A30"/>
    <circle cx="34" cy="38" r="14" fill="#173823" stroke="#19D969"/>
    <path d="M27 38h14M34 31v14" stroke="#8EF2B2" stroke-width="2"/>
    <text x="24" y="82" class="t n">User wallet</text>
    <text x="24" y="108" class="m s">Sign • Fund • Trade</text>
  </g>

  <g transform="translate(360 202)">
    <rect width="214" height="128" rx="18" fill="#0E1912" stroke="#2B3A30"/>
    <rect x="24" y="24" width="48" height="28" rx="8" fill="#173823" stroke="#19D969"/>
    <circle cx="39" cy="38" r="4" fill="#19D969"/><circle cx="55" cy="38" r="4" fill="#8EF2B2"/>
    <text x="24" y="82" class="t n">Builder DEX</text>
    <text x="24" y="108" class="m s">Brand • Users • Fees</text>
  </g>

  <g transform="translate(650 170)">
    <rect width="260" height="192" rx="22" fill="#0D1D13" stroke="#19D969" stroke-width="2"/>
    <path d="M30 34c12-18 30-18 42 0s30 18 42 0" fill="none" stroke="#19D969" stroke-width="5" stroke-linecap="round"/>
    <text x="30" y="82" class="t n">DexBuilder Core</text>
    <g transform="translate(30 106)"><rect width="88" height="30" rx="9" fill="#13291A"/><text x="14" y="20" class="t chip">Matching</text></g>
    <g transform="translate(128 106)"><rect width="98" height="30" rx="9" fill="#13291A"/><text x="15" y="20" class="t chip">Margin rules</text></g>
    <g transform="translate(30 146)"><rect width="88" height="30" rx="9" fill="#13291A"/><text x="22" y="20" class="t chip">Ledger</text></g>
    <g transform="translate(128 146)"><rect width="98" height="30" rx="9" fill="#13291A"/><text x="17" y="20" class="t chip">Market data</text></g>
  </g>

  <g transform="translate(995 202)">
    <rect width="145" height="128" rx="18" fill="#0E1912" stroke="#2B3A30"/>
    <path d="M24 32h46v28H24zM31 25h46v28" fill="none" stroke="#19D969" stroke-width="2"/>
    <text x="22" y="84" class="t n">Settlement</text>
    <text x="22" y="108" class="m s">Chains • Vaults</text>
  </g>

  <g transform="translate(360 415)">
    <rect width="165" height="52" rx="14" fill="#0C1510" stroke="#26352B"/><text x="28" y="32" class="t chip">REST API</text>
    <rect x="178" width="165" height="52" rx="14" fill="#0C1510" stroke="#26352B"/><text x="203" y="32" class="t chip">WebSocket</text>
    <rect x="356" width="190" height="52" rx="14" fill="#0C1510" stroke="#26352B"/><text x="378" y="32" class="t chip">Transaction Builder</text>
  </g>
  <path d="M467 330V415M753 362V415M805 362V390H811V415" fill="none" stroke="#314039" stroke-width="2" stroke-dasharray="5 7"/>
</svg>
