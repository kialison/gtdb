<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Wallet-authorized action flow</title><desc id="desc">The backend requests an unsigned payload, the wallet reviews and signs it, and DexBuilder verifies, submits, and tracks the action.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#19D969"/></marker><style>.t{font-family:Inter,Arial,sans-serif;fill:#F3F7F4}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#99A69D}.h{font-size:28px;font-weight:700}.k{font-size:13px;font-weight:700;letter-spacing:2px;fill:#19D969}.n{font-size:17px;font-weight:650}.s{font-size:13px}.lane{font-size:14px;font-weight:700;fill:#AEB9B1}</style></defs>
  <rect width="1200" height="540" rx="28" fill="#07100B"/>
  <text x="64" y="62" class="t k">WALLET-AUTHORIZED ACTION</text><text x="64" y="102" class="t h">Construct safely. Sign locally. Verify exactly.</text>
  <text x="64" y="132" class="m s">DexBuilder returns the payload to sign and never receives the user's private key.</text>
  <line x1="170" y1="170" x2="170" y2="475" stroke="#29382E"/><text x="56" y="225" class="t lane">BACKEND</text><text x="72" y="320" class="t lane">WALLET</text><text x="47" y="415" class="t lane">DexBuilder</text>
  <line x1="170" y1="270" x2="1140" y2="270" stroke="#17231B"/><line x1="170" y1="365" x2="1140" y2="365" stroke="#17231B"/>
  <g transform="translate(220 188)"><rect width="185" height="68" rx="16" fill="#0E1912" stroke="#2A3930"/><text x="20" y="30" class="t n">1. Request build</text><text x="20" y="52" class="m s">action + account</text></g>
  <path d="M405 222H505" stroke="#19D969" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(505 378)"><rect width="190" height="68" rx="16" fill="#0D1D13" stroke="#19D969"/><text x="20" y="30" class="t n">2. Return payload</text><text x="20" y="52" class="m s">hash + expiry + fees</text></g>
  <path d="M600 378V336" stroke="#19D969" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(505 282)"><rect width="190" height="68" rx="16" fill="#0E1912" stroke="#2A3930"/><text x="20" y="30" class="t n">3. Review &amp; sign</text><text x="20" y="52" class="m s">private key stays local</text></g>
  <path d="M695 316H790" stroke="#19D969" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(790 378)"><rect width="190" height="68" rx="16" fill="#0E1912" stroke="#2A3930"/><text x="20" y="30" class="t n">4. Verify &amp; submit</text><text x="20" y="52" class="m s">hash + nonce + signature</text></g>
  <path d="M885 378V256" stroke="#19D969" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(790 188)"><rect width="190" height="68" rx="16" fill="#0D1D13" stroke="#19D969"/><text x="20" y="30" class="t n">5. Track status</text><text x="20" y="52" class="m s">request ID + ledger</text></g>
</svg>
